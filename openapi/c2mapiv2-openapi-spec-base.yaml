openapi: 3.0.3
info:
  title: C2M API v2
  version: 2.0.0
  description: API for submitting mailing jobs with various document routing options
  x-http-error-map:
    '400':
      errorType: ValidationError
      errorCodes:
      - MISSING_REQUIRED_FIELD
      - INVALID_ONEOF
      - INVALID_JSON
      - INVALID_FORMAT
    '401':
      errorType: AuthenticationError
      errorCodes:
      - MISSING_AUTH_HEADER
      - INVALID_TOKEN
      - EXPIRED_TOKEN
    '403':
      errorType: AuthorizationError
      errorCodes:
      - INSUFFICIENT_PERMISSIONS
      - ACCOUNT_SUSPENDED
    '404':
      errorType: ResourceNotFoundError
      errorCodes:
      - JOB_NOT_FOUND
      - RESOURCE_NOT_FOUND
    '422':
      errorType: ValidationError
      errorCodes:
      - INVALID_ENUM_VALUE
      - MUTUAL_EXCLUSION_VIOLATION
      - INVALID_FORMAT
    '429':
      errorType: RateLimitError
      errorCodes:
      - RATE_LIMIT_EXCEEDED
    '500':
      errorType: ServerError
      errorCodes:
      - SERVER_ERROR
      - DATABASE_ERROR
      - EXTERNAL_SERVICE_ERROR
  x-numeric-constraints:
    month:
      minimum: 1
      maximum: 12
    year:
      minimum: 2000
      maximum: 2099
    startPage:
      minimum: 1
    endPage:
      minimum: 1
  x-valid-combinations:
  - when_field: color
    when_value: black_and_white
    then_field: paperType
    then_values:
    - white
    - white_24
    - ivory
  - when_field: mailClass
    when_value: non_profit
    then_field: documentClass
    then_values:
    - letter
    - flat
  - when_field: envelope
    when_value: none
    then_field: layout
    then_values:
    - address_on_first_page
    - address_on_back_page
  x-mutual-exclusion:
  - jobTemplate
  - jobOptions
servers:
- url: https://api.click2mail.com/v2
  description: Production server
tags:
- name: jobs
  description: Job submission endpoints
components:
  schemas:
    month:
      description: Expiration month as an integer (1-12).
      type: integer
      minimum: 1
      maximum: 12
    year:
      description: Expiration year as a four-digit integer (e.g. 2029).
      type: integer
      minimum: 2000
      maximum: 2099
    startPage:
      description: First page of this job's page range, 1-indexed (inclusive).
      type: integer
      minimum: 1
    endPage:
      description: Last page of this job's page range (inclusive). Must be >= startPage.
      type: integer
      minimum: 1
    submitDocParams:
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        docSourceAll:
          $ref: '#/components/schemas/docSourceAll'
        recipientAddressSource:
          $ref: '#/components/schemas/recipientAddressSource'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        returnAddress:
          $ref: '#/components/schemas/returnAddress'
        jobOptions:
          $ref: '#/components/schemas/jobOptions'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - docSourceAll
      - recipientAddressSource
    submitSinglePdfAddressCaptureParams:
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        docSourceStandard:
          $ref: '#/components/schemas/docSourceStandard'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        returnAddress:
          $ref: '#/components/schemas/returnAddress'
        jobOptions:
          $ref: '#/components/schemas/jobOptions'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - docSourceStandard
    submitSinglePdfSplitParams:
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        docSourceStandard:
          $ref: '#/components/schemas/docSourceStandard'
        pdfSplitJobsWithAddress:
          $ref: '#/components/schemas/pdfSplitJobsWithAddress'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        returnAddress:
          $ref: '#/components/schemas/returnAddress'
        jobOptions:
          $ref: '#/components/schemas/jobOptions'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - docSourceStandard
      - pdfSplitJobsWithAddress
    submitSinglePdfSplitAddressCaptureParams:
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        docSourceStandard:
          $ref: '#/components/schemas/docSourceStandard'
        pdfSplitJobsNoAddress:
          $ref: '#/components/schemas/pdfSplitJobsNoAddress'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        returnAddress:
          $ref: '#/components/schemas/returnAddress'
        jobOptions:
          $ref: '#/components/schemas/jobOptions'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - docSourceStandard
      - pdfSplitJobsNoAddress
    submitMultiDocMergeParams:
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        mergeDocumentSource:
          $ref: '#/components/schemas/mergeDocumentSource'
        recipientAddressSource:
          $ref: '#/components/schemas/recipientAddressSource'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        returnAddress:
          $ref: '#/components/schemas/returnAddress'
        jobOptions:
          $ref: '#/components/schemas/jobOptions'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - mergeDocumentSource
      - recipientAddressSource
    submitMultiZipParams:
      type: object
      properties:
        docSourceZipFileRef:
          $ref: '#/components/schemas/docSourceZipFileRef'
        multiZipJobs:
          $ref: '#/components/schemas/multiZipJobs'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - docSourceZipFileRef
      - multiZipJobs
    submitMultiZipAddressCaptureParams:
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        zipDocumentSource:
          $ref: '#/components/schemas/zipDocumentSource'
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
        returnAddress:
          $ref: '#/components/schemas/returnAddress'
        jobOptions:
          $ref: '#/components/schemas/jobOptions'
        tags:
          $ref: '#/components/schemas/tags'
      required:
      - zipDocumentSource
    jobTemplate:
      description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
      type: string
    returnAddress:
      description: Optional sender return address printed on the mailpiece.
      type: object
      properties:
        firstName:
          description: Recipient's first name.
          type: string
        lastName:
          description: Recipient's last name.
          type: string
        company:
          description: Recipient's company or organisation name (optional).
          type: string
        address1:
          description: Primary street address line.
          type: string
        city:
          description: City name.
          type: string
        state:
          description: Two-letter state or province abbreviation.
          type: string
        zip:
          description: ZIP or postal code.
          type: string
        country:
          description: Country code (e.g. USA).
          type: string
        address2:
          description: Secondary address line (suite, apartment, floor, etc.).
          type: string
        address3:
          description: Tertiary address line.
          type: string
      required:
      - firstName
      - lastName
      - address1
      - city
      - state
      - zip
      - country
    jobOptions:
      description: Explicit print and mail configuration options. Mutually exclusive with jobTemplate.
      type: object
      properties:
        documentClass:
          description: Document class determining the mailpiece format.
          type: string
          enum:
          - letter
          - postcard
          - brochure
          - flat
        layout:
          description: Page layout controlling where the recipient address is printed.
          type: string
          enum:
          - address_on_first_page
          - address_on_back_page
        productionTime:
          description: Production time preference (next_day, two_day, etc.).
          type: string
          enum:
          - next_day
          - two_day
          - three_day
          - standard
          - same_day
        envelope:
          description: Envelope type used for the mailing.
          type: string
          enum:
          - standard
          - none
          - flat
          - double_window
        color:
          description: Color mode for printing (full_color or black_and_white).
          type: string
          enum:
          - full_color
          - black_and_white
        paperType:
          description: Paper stock for printing.
          type: string
          enum:
          - white
          - white_24
          - ivory
          - glossy
        printOption:
          description: Duplex setting (double_sided or single_sided).
          type: string
          enum:
          - double_sided
          - single_sided
        mailClass:
          description: USPS mail class (first_class, standard, or non_profit).
          type: string
          enum:
          - first_class
          - standard
          - non_profit
      required:
      - documentClass
      - layout
      - productionTime
      - envelope
      - color
      - paperType
      - printOption
      - mailClass
    documentClass:
      description: Document class determining the mailpiece format.
      type: string
      enum:
      - letter
      - postcard
      - brochure
      - flat
    layout:
      description: Page layout controlling where the recipient address is printed.
      type: string
      enum:
      - address_on_first_page
      - address_on_back_page
    productionTime:
      description: Production time preference (next_day, two_day, etc.).
      type: string
      enum:
      - next_day
      - two_day
      - three_day
      - standard
      - same_day
    envelope:
      description: Envelope type used for the mailing.
      type: string
      enum:
      - standard
      - none
      - flat
      - double_window
    color:
      description: Color mode for printing (full_color or black_and_white).
      type: string
      enum:
      - full_color
      - black_and_white
    paperType:
      description: Paper stock for printing.
      type: string
      enum:
      - white
      - white_24
      - ivory
      - glossy
    printOption:
      description: Duplex setting (double_sided or single_sided).
      type: string
      enum:
      - double_sided
      - single_sided
    mailClass:
      description: USPS mail class (first_class, standard, or non_profit).
      type: string
      enum:
      - first_class
      - standard
      - non_profit
    tags:
      $ref: '#/components/schemas/tagsList'
    tagsList:
      description: Array of user-defined string tags.
      type: array
      items:
        type: string
    firstName:
      description: Recipient's first name.
      type: string
    lastName:
      description: Recipient's last name.
      type: string
    company:
      description: Recipient's company or organisation name (optional).
      type: string
    address1:
      description: Primary street address line.
      type: string
    address2:
      description: Secondary address line (suite, apartment, floor, etc.).
      type: string
    address3:
      description: Tertiary address line.
      type: string
    city:
      description: City name.
      type: string
    state:
      description: Two-letter state or province abbreviation.
      type: string
    zip:
      description: ZIP or postal code.
      type: string
    country:
      description: Country code (e.g. USA).
      type: string
    foo1:
      description: "User-defined merge variable 1 \u2014 forwarded to the address list merge mapping for personalisation."
      type: string
    foo2:
      description: "User-defined merge variable 2 \u2014 forwarded to the address list merge mapping for personalisation."
      type: string
    address:
      description: Mailing address with required core fields (name, address1, city, state, zip, country) and optional extended fields (company, address2, address3, foo1, foo2).
      type: object
      properties:
        firstName:
          description: Recipient's first name.
          type: string
        lastName:
          description: Recipient's last name.
          type: string
        address1:
          description: Primary street address line.
          type: string
        city:
          description: City name.
          type: string
        state:
          description: Two-letter state or province abbreviation.
          type: string
        zip:
          description: ZIP or postal code.
          type: string
        country:
          description: Country code (e.g. USA).
          type: string
        address2:
          description: Secondary address line (suite, apartment, floor, etc.).
          type: string
        address3:
          description: Tertiary address line.
          type: string
        foo1:
          description: "User-defined merge variable 1 \u2014 forwarded to the address list merge mapping for personalisation."
          type: string
        foo2:
          description: "User-defined merge variable 2 \u2014 forwarded to the address list merge mapping for personalisation."
          type: string
      required:
      - firstName
      - lastName
      - address1
      - city
      - state
      - zip
      - country
    recipientAddressSource:
      description: "Recipient address specification \u2014 one of: inline address list of one or more recipients (with optional mapping), stored list ID, or stored address ID."
      oneOf:
      - type: object
        properties:
          recipientAddressByList:
            $ref: '#/components/schemas/recipientAddressByList'
        required:
        - recipientAddressByList
      - type: object
        properties:
          recipientAddressByAddressId:
            $ref: '#/components/schemas/recipientAddressByAddressId'
        required:
        - recipientAddressByAddressId
      - type: object
        properties:
          recipientAddressByListId:
            $ref: '#/components/schemas/recipientAddressByListId'
        required:
        - recipientAddressByListId
    recipientAddressByList:
      description: Inline list of recipient addresses with an optional merge-field mapping ID.
      type: object
      properties:
        mappingId:
          description: Integer ID of a merge-field mapping profile that associates address columns to template variables. If omitted, the account default mapping is used.
          type: integer
        addressList:
          $ref: '#/components/schemas/addressList'
        addressListName:
          description: Optional name for this address list record.
          type: string
      required:
      - addressList
    recipientAddressByListId:
      description: Reference to a previously stored recipient address list by its integer ID.
      type: integer
    recipientAddressByAddressId:
      description: Reference to a previously stored individual recipient address by its integer ID.
      type: integer
    mappingId:
      description: Integer ID of a merge-field mapping profile that associates address columns to template variables. If omitted, the account default mapping is used.
      type: integer
    addressListName:
      description: Optional name for this address list record.
      type: string
    addressListId:
      description: Integer ID of a previously stored recipient address list.
      type: integer
    addressId:
      description: Integer ID of a previously stored individual recipient address.
      type: integer
    addressList:
      description: "List of recipient mailing addresses \u2014 used for batch sends and mail merge."
      type: array
      items:
        $ref: '#/components/schemas/address'
    documentIdSource:
      description: Source a document by its previously stored document ID.
      type: object
      properties:
        documentId:
          description: Integer ID of a previously stored or uploaded document.
          type: integer
      required:
      - documentId
    documentId:
      description: Integer ID of a previously stored or uploaded document.
      type: integer
    requestIdSource:
      description: Source a document from a prior file upload by request ID. If the upload request contained multiple files, filename is required to identify which one.
      type: object
      properties:
        requestId:
          description: Integer ID of a prior file upload request. Also returned in success responses.
          type: integer
        filename:
          description: Filename of a specific file within an upload request or ZIP archive.
          type: string
      required:
      - requestId
    requestId:
      description: Integer ID of a prior file upload request. Also returned in success responses.
      type: integer
    filename:
      description: Filename of a specific file within an upload request or ZIP archive.
      type: string
    urlSource:
      description: Fetch the document from an external URL at submission time.
      type: object
      properties:
        url:
          description: URL from which the API will fetch the document at submission time.
          type: string
          format: uri
      required:
      - url
    url:
      description: URL from which the API will fetch the document at submission time.
      type: string
    zipDocumentIdSource:
      description: "Source a specific file within a stored ZIP archive \u2014 requires the archive ID and the filename of the target file within the archive."
      type: object
      properties:
        zipDocumentId:
          description: Integer ID of a previously stored ZIP archive.
          type: integer
        filename:
          description: Filename of a specific file within an upload request or ZIP archive.
          type: string
      required:
      - zipDocumentId
      - filename
    zipDocumentId:
      description: Integer ID of a previously stored ZIP archive.
      type: integer
    zipRequestIdSource:
      description: "Source a specific file within an uploaded ZIP archive \u2014 requires the upload request ID, the zip filename within that request, and the target filename in the zip."
      type: object
      properties:
        requestId:
          description: Integer ID of a prior file upload request. Also returned in success responses.
          type: integer
        zipFilename:
          description: Filename of the ZIP file within an upload request (distinguishes the zip from other files uploaded in the same request).
          type: string
        filename:
          description: Filename of a specific file within an upload request or ZIP archive.
          type: string
      required:
      - requestId
      - zipFilename
      - filename
    zipFilename:
      description: Filename of the ZIP file within an upload request (distinguishes the zip from other files uploaded in the same request).
      type: string
    zipDocumentIdOnly:
      description: "Reference to a stored ZIP archive without a file selection \u2014 used at the batch job top level where individual job items select their own filenames."
      type: object
      properties:
        zipDocumentId:
          description: Integer ID of a previously stored ZIP archive.
          type: integer
      required:
      - zipDocumentId
    zipRequestIdOnly:
      description: "Reference to an uploaded ZIP archive by request ID only \u2014 used at the batch top level; individual job items carry the filename selection."
      type: object
      properties:
        requestId:
          description: Integer ID of a prior file upload request. Also returned in success responses.
          type: integer
      required:
      - requestId
    zipDocumentSource:
      description: "ZIP document source \u2014 either a stored zip archive (zipDocumentId) or an uploaded zip archive (requestId)."
      oneOf:
      - type: object
        properties:
          zipDocumentIdSource:
            $ref: '#/components/schemas/zipDocumentIdSource'
        required:
        - zipDocumentIdSource
      - type: object
        properties:
          zipRequestIdSource:
            $ref: '#/components/schemas/zipRequestIdSource'
        required:
        - zipRequestIdSource
    docSourceStandard:
      description: "Document source \u2014 standard (non-zip) variants only: requestId, documentId, or URL."
      oneOf:
      - type: object
        properties:
          documentIdSource:
            $ref: '#/components/schemas/documentIdSource'
        required:
        - documentIdSource
      - type: object
        properties:
          requestIdSource:
            $ref: '#/components/schemas/requestIdSource'
        required:
        - requestIdSource
      - type: object
        properties:
          urlSource:
            $ref: '#/components/schemas/urlSource'
        required:
        - urlSource
    docSourceZipFile:
      description: "Document source \u2014 zip variants: a specific file within a stored ZIP (zipDocumentId + filename) or uploaded ZIP (requestId + zipFilename + filename)."
      oneOf:
      - type: object
        properties:
          zipDocumentIdSource:
            $ref: '#/components/schemas/zipDocumentIdSource'
        required:
        - zipDocumentIdSource
      - type: object
        properties:
          zipRequestIdSource:
            $ref: '#/components/schemas/zipRequestIdSource'
        required:
        - zipRequestIdSource
    docSourceZipFileRef:
      description: "Top-level ZIP archive reference for batch endpoints \u2014 identifies the archive itself, not a file within it. No filename is required at this level."
      oneOf:
      - type: object
        properties:
          zipDocumentIdOnly:
            $ref: '#/components/schemas/zipDocumentIdOnly'
        required:
        - zipDocumentIdOnly
      - type: object
        properties:
          zipRequestIdOnly:
            $ref: '#/components/schemas/zipRequestIdOnly'
        required:
        - zipRequestIdOnly
    docSourceAll:
      description: "Document source \u2014 accepts any supported variant: requestId, documentId, URL, or zip-based (zipDocumentId or zipRequestId)."
      oneOf:
      - type: object
        properties:
          documentIdSource:
            $ref: '#/components/schemas/documentIdSource'
        required:
        - documentIdSource
      - type: object
        properties:
          requestIdSource:
            $ref: '#/components/schemas/requestIdSource'
        required:
        - requestIdSource
      - type: object
        properties:
          urlSource:
            $ref: '#/components/schemas/urlSource'
        required:
        - urlSource
      - type: object
        properties:
          zipDocumentIdSource:
            $ref: '#/components/schemas/zipDocumentIdSource'
        required:
        - zipDocumentIdSource
      - type: object
        properties:
          zipRequestIdSource:
            $ref: '#/components/schemas/zipRequestIdSource'
        required:
        - zipRequestIdSource
    mergeDocumentSource:
      $ref: '#/components/schemas/documentsToMerge'
    documentsToMerge:
      description: Ordered array of document references to merge into one output document. Minimum two entries required.
      type: array
      items:
        $ref: '#/components/schemas/mergeDocumentRef'
    mergeDocumentRef:
      description: "A single document to include in the merge \u2014 either a stored document ID or an upload request ID (with optional filename)."
      oneOf:
      - type: object
        properties:
          mergeByDocumentId:
            $ref: '#/components/schemas/mergeByDocumentId'
        required:
        - mergeByDocumentId
      - type: object
        properties:
          mergeByRequestId:
            $ref: '#/components/schemas/mergeByRequestId'
        required:
        - mergeByRequestId
    mergeByDocumentId:
      description: Merge a stored document identified by its document ID.
      type: object
      properties:
        documentId:
          description: Integer ID of a previously stored or uploaded document.
          type: integer
      required:
      - documentId
    mergeByRequestId:
      description: Merge an uploaded document identified by its upload request ID, with an optional filename when the request contains multiple files.
      type: object
      properties:
        requestId:
          description: Integer ID of a prior file upload request. Also returned in success responses.
          type: integer
        filename:
          description: Filename of a specific file within an upload request or ZIP archive.
          type: string
      required:
      - requestId
    multiDocJobs:
      description: List of independent document-per-recipient jobs (each job has its own document source and recipient address).
      type: array
      items:
        $ref: '#/components/schemas/multiDocJobItem'
    multiDocJobItem:
      description: A single independent document job entry within a multi-doc batch.
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        docSourceAll:
          $ref: '#/components/schemas/docSourceAll'
        recipientAddressSource:
          $ref: '#/components/schemas/recipientAddressSource'
      required:
      - docSourceAll
      - recipientAddressSource
    pdfSplitJobsWithAddress:
      description: List of page-range job items, each with its own inline recipient address.
      type: array
      items:
        $ref: '#/components/schemas/pdfSplitJobItemWithAddress'
    pdfSplitJobsNoAddress:
      description: "List of page-range job items without inline addresses \u2014 addresses are captured externally (POST /batch/split/address-capture)."
      type: array
      items:
        $ref: '#/components/schemas/pdfSplitJobItemNoAddress'
    pdfSplitJobItemWithAddress:
      description: 'A single page-range job entry: page range (startPage, endPage) plus a recipient address.'
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        startPage:
          description: First page of this job's page range, 1-indexed (inclusive).
          type: integer
          minimum: 1
        endPage:
          description: Last page of this job's page range (inclusive). Must be >= startPage.
          type: integer
          minimum: 1
        recipientAddressSource:
          $ref: '#/components/schemas/recipientAddressSource'
      required:
      - startPage
      - endPage
      - recipientAddressSource
    pdfSplitJobItemNoAddress:
      description: "A single page-range job entry: page range only (no address \u2014 used for address-capture endpoint)."
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        startPage:
          description: First page of this job's page range, 1-indexed (inclusive).
          type: integer
          minimum: 1
        endPage:
          description: Last page of this job's page range (inclusive). Must be >= startPage.
          type: integer
          minimum: 1
      required:
      - startPage
      - endPage
    multiZipJobs:
      description: List of per-file job items extracted from a ZIP archive (POST /batch/zip).
      type: array
      items:
        $ref: '#/components/schemas/multiZipJobItem'
    multiZipJobItem:
      description: 'A single ZIP file job entry: optional job template, filename within the ZIP, and recipient address.'
      type: object
      properties:
        jobTemplate:
          description: Saved job template name; pre-populates all print and mail options. Mutually exclusive with jobOptions.
          type: string
        filename:
          description: Filename of a specific file within an upload request or ZIP archive.
          type: string
        recipientAddressSource:
          $ref: '#/components/schemas/recipientAddressSource'
      required:
      - filename
      - recipientAddressSource
    id:
      description: "Integer identifier \u2014 alias for integer, used for all ID fields."
      type: integer
    paymentDetails:
      description: "Payment method \u2014 one of: creditCard, invoice, ACH bank transfer, or account credit. The paymentType field names the method; the matching details object carries its data."
      oneOf:
      - $ref: '#/components/schemas/creditCardPayment'
      - $ref: '#/components/schemas/invoicePayment'
      - $ref: '#/components/schemas/achPayment'
      - $ref: '#/components/schemas/userCreditPayment'
      discriminator:
        propertyName: paymentType
        mapping:
          creditCard: '#/components/schemas/creditCardPayment'
          invoice: '#/components/schemas/invoicePayment'
          ach: '#/components/schemas/achPayment'
          userCredit: '#/components/schemas/userCreditPayment'
    paymentType:
      description: "Payment method type; must match the details object sent (creditCard \u2192 creditCardDetails, invoice \u2192 invoiceDetails, ach \u2192 achDetails, userCredit \u2192 creditAmount)."
      type: string
      enum:
      - creditCard
      - invoice
      - ach
      - userCredit
    creditCardPayment:
      description: Credit card payment variant.
      type: object
      properties:
        paymentType:
          description: "Payment method type; must match the details object sent (creditCard \u2192 creditCardDetails, invoice \u2192 invoiceDetails, ach \u2192 achDetails, userCredit \u2192 creditAmount)."
          type: string
          enum:
          - creditCard
        creditCardDetails:
          $ref: '#/components/schemas/creditCardDetails'
      required:
      - paymentType
      - creditCardDetails
    invoicePayment:
      description: "Invoice payment \u2014 billed to an existing account invoice."
      type: object
      properties:
        paymentType:
          description: "Payment method type; must match the details object sent (creditCard \u2192 creditCardDetails, invoice \u2192 invoiceDetails, ach \u2192 achDetails, userCredit \u2192 creditAmount)."
          type: string
          enum:
          - invoice
        invoiceDetails:
          $ref: '#/components/schemas/invoiceDetails'
      required:
      - paymentType
      - invoiceDetails
    achPayment:
      description: ACH bank transfer payment variant.
      type: object
      properties:
        paymentType:
          description: "Payment method type; must match the details object sent (creditCard \u2192 creditCardDetails, invoice \u2192 invoiceDetails, ach \u2192 achDetails, userCredit \u2192 creditAmount)."
          type: string
          enum:
          - ach
        achDetails:
          $ref: '#/components/schemas/achDetails'
      required:
      - paymentType
      - achDetails
    userCreditPayment:
      description: Payment deducted from the account's prepaid credit balance.
      type: object
      properties:
        paymentType:
          description: "Payment method type; must match the details object sent (creditCard \u2192 creditCardDetails, invoice \u2192 invoiceDetails, ach \u2192 achDetails, userCredit \u2192 creditAmount)."
          type: string
          enum:
          - userCredit
        creditAmount:
          $ref: '#/components/schemas/creditAmount'
      required:
      - paymentType
      - creditAmount
    creditCardDetails:
      description: 'Credit card payment fields: card type, card number, expiration date, and CVV.'
      type: object
      properties:
        cardType:
          description: 'Card brand enum: visa, mastercard, discover, or americanExpress.'
          type: string
          enum:
          - visa
          - mastercard
          - discover
          - americanExpress
        cardNumber:
          description: Credit card number (PAN) as a string.
          type: string
        expirationDate:
          $ref: '#/components/schemas/expirationDate'
        cvv:
          description: Card security code (CVV/CVC) as an integer.
          type: integer
      required:
      - cardType
      - cardNumber
      - expirationDate
      - cvv
    invoiceDetails:
      description: 'Invoice payment fields: invoice number and amount due.'
      type: object
      properties:
        invoiceNumber:
          description: Invoice reference number.
          type: string
        amountDue:
          description: Amount due on the invoice.
          type: number
      required:
      - invoiceNumber
      - amountDue
    achDetails:
      description: 'ACH payment fields: routing number, bank account number, and check digit.'
      type: object
      properties:
        routingNumber:
          description: ABA bank routing number.
          type: string
        accountNumber:
          description: Bank account number.
          type: string
        checkDigit:
          description: ACH check digit.
          type: integer
      required:
      - routingNumber
      - accountNumber
      - checkDigit
    creditAmount:
      description: 'Account credit payment fields: monetary amount and ISO currency code.'
      type: object
      properties:
        amount:
          description: Monetary amount as a numeric value.
          type: number
        currency:
          description: ISO 4217 currency code (USD, EUR, GBP, CAD, or AUD).
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - CAD
          - AUD
      required:
      - amount
      - currency
    currency:
      description: ISO 4217 currency code (USD, EUR, GBP, CAD, or AUD).
      type: string
      enum:
      - USD
      - EUR
      - GBP
      - CAD
      - AUD
    amount:
      description: Monetary amount as a numeric value.
      type: number
    cardNumber:
      description: Credit card number (PAN) as a string.
      type: string
    expirationDate:
      description: Card expiration date containing month and year.
      type: object
      properties:
        month:
          description: Expiration month as an integer (1-12).
          type: integer
          minimum: 1
          maximum: 12
        year:
          description: Expiration year as a four-digit integer (e.g. 2029).
          type: integer
          minimum: 2000
          maximum: 2099
      required:
      - month
      - year
    cvv:
      description: Card security code (CVV/CVC) as an integer.
      type: integer
    routingNumber:
      description: ABA bank routing number.
      type: string
    accountNumber:
      description: Bank account number.
      type: string
    checkDigit:
      description: ACH check digit.
      type: integer
    invoiceNumber:
      description: Invoice reference number.
      type: string
    amountDue:
      description: Amount due on the invoice.
      type: number
    cardType:
      description: 'Card brand enum: visa, mastercard, discover, or americanExpress.'
      type: string
      enum:
      - visa
      - mastercard
      - discover
      - americanExpress
    standardResponse:
      description: Success response returned for all successful job submissions.
      type: object
      properties:
        status:
          description: Job status string (e.g. "accepted").
          type: string
        message:
          description: Human-readable confirmation message (e.g. "Your request has been queued").
          type: string
        requestId:
          description: Integer ID of a prior file upload request. Also returned in success responses.
          type: integer
      required:
      - status
      - message
      - requestId
    status:
      description: Job status string (e.g. "accepted").
      type: string
    message:
      description: Human-readable confirmation message (e.g. "Your request has been queued").
      type: string
    errorResponse:
      description: Error response structure returned for all API error conditions.
      type: object
      properties:
        errorType:
          description: High-level error category string (ValidationError, AuthenticationError, etc.).
          type: string
          enum:
          - ValidationError
          - AuthenticationError
          - AuthorizationError
          - ResourceNotFoundError
          - RateLimitError
          - ServerError
        errorMessage:
          description: Human-readable error description.
          type: string
        errorCode:
          description: Machine-readable error code string (e.g. MISSING_REQUIRED_FIELD).
          type: string
          enum:
          - MISSING_REQUIRED_FIELD
          - INVALID_ONEOF
          - INVALID_JSON
          - MISSING_AUTH_HEADER
          - INVALID_TOKEN
          - EXPIRED_TOKEN
          - INSUFFICIENT_PERMISSIONS
          - ACCOUNT_SUSPENDED
          - JOB_NOT_FOUND
          - RESOURCE_NOT_FOUND
          - INVALID_ENUM_VALUE
          - MUTUAL_EXCLUSION_VIOLATION
          - INVALID_FORMAT
          - SERVER_ERROR
          - DATABASE_ERROR
          - EXTERNAL_SERVICE_ERROR
          - RATE_LIMIT_EXCEEDED
        errorDetails:
          description: Optional JSON object with additional error context (free-form key/value pairs).
          type: string
        errorTrackingId:
          description: Optional support tracking identifier in the format TRK-YYYYMMDD-XXXXXX.
          type: string
      required:
      - errorType
      - errorMessage
      - errorCode
    errorType:
      description: High-level error category string (ValidationError, AuthenticationError, etc.).
      type: string
      enum:
      - ValidationError
      - AuthenticationError
      - AuthorizationError
      - ResourceNotFoundError
      - RateLimitError
      - ServerError
    errorMessage:
      description: Human-readable error description.
      type: string
    errorCode:
      description: Machine-readable error code string (e.g. MISSING_REQUIRED_FIELD).
      type: string
      enum:
      - MISSING_REQUIRED_FIELD
      - INVALID_ONEOF
      - INVALID_JSON
      - MISSING_AUTH_HEADER
      - INVALID_TOKEN
      - EXPIRED_TOKEN
      - INSUFFICIENT_PERMISSIONS
      - ACCOUNT_SUSPENDED
      - JOB_NOT_FOUND
      - RESOURCE_NOT_FOUND
      - INVALID_ENUM_VALUE
      - MUTUAL_EXCLUSION_VIOLATION
      - INVALID_FORMAT
      - SERVER_ERROR
      - DATABASE_ERROR
      - EXTERNAL_SERVICE_ERROR
      - RATE_LIMIT_EXCEEDED
    errorDetails:
      description: Optional JSON object with additional error context (free-form key/value pairs).
