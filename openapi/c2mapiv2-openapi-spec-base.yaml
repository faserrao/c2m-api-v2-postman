security:
- bearerAuth: []
paths:
  /static:
    post:
      tags:
      - jobs
      summary: Submit single document
      description: Submits a mailing job for a single document to one or more recipients. The request body must include a document source, recipient address information, and payment details.
      operationId: submitDocParams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submitDocParams'
            examples:
              default:
                summary: Example request
                value:
                  docSourceAll:
                    documentIdSource:
                      documentId: 85766
                  recipientAddressSource:
                    recipientAddressByList:
                      mappingId: 5001
                      addressList:
                      - firstName: Jeremy
                        lastName: Meadows
                        address1: 32243 John Union Apt. 308
                        city: Nathanielland
                        state: GU
                        zip: '84642'
                        country: USA
                        address2: Suite 100
                        address3: ''
                        foo1: Custom Field 1
                        foo2: Custom Field 2
                      addressListName: Marketing Campaign Q1
                  paymentDetails:
                    paymentType: creditCard
                    creditCardDetails:
                      cardType: visa
                      cardNumber: '4111111111111111'
                      expirationDate:
                        month: 12
                        year: 2029
                      cvv: 123
                  returnAddress:
                    firstName: Kayla
                    lastName: Wood
                    company: Ochoa-Hudson
                    address1: 740 Michael Fork Apt. 349
                    city: Marcusmouth
                    state: WV
                    zip: '39348'
                    country: USA
                    address2: Suite 100
                    address3: ''
                  jobOptions:
                    documentClass: letter
                    layout: address_on_first_page
                    productionTime: next_day
                    envelope: standard
                    color: full_color
                    paperType: white
                    printOption: double_sided
                    mailClass: first_class
                  tags:
                  - q1-campaign
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standardResponse'
              examples:
                success:
                  summary: Request accepted and queued
                  value:
                    status: accepted
                    message: Your request has been queued
                    requestId: 85696
        '400':
          description: Bad Request - Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                missing-required-field:
                  summary: Missing required field
                  value:
                    errorType: ValidationError
                    errorMessage: Required field is missing from request body
                    errorCode: MISSING_REQUIRED_FIELD
                    errorDetails: '{"field": "docSourceAll", "location": "requestBody"}'
                    errorTrackingId: TRK-20260115-A07ACA
                invalid-oneof:
                  summary: Invalid oneOf selection
                  value:
                    errorType: ValidationError
                    errorMessage: Request must match exactly one of the defined schemas
                    errorCode: INVALID_ONEOF
                    errorDetails: '{"field": "docSourceAll", "issue": "exactly one variant must be provided"}'
                    errorTrackingId: TRK-20260115-109368
                invalid-json:
                  summary: Invalid JSON
                  value:
                    errorType: ValidationError
                    errorMessage: Request body contains malformed JSON
                    errorCode: INVALID_JSON
                    errorDetails: '{"error": "Unexpected token at position 42", "line": 3}'
                    errorTrackingId: TRK-20260115-DC71D8
                invalid-format:
                  summary: Invalid field format
                  value:
                    errorType: ValidationError
                    errorMessage: Field contains invalid format or value
                    errorCode: INVALID_FORMAT
                    errorDetails: '{"field": "recipientAddressSource.recipientAddressByList.addressList[0].zip", "provided": "1234", "expected": "5 or 9 digits"}'
                    errorTrackingId: TRK-20260115-FA7187
        '401':
          description: Unauthorized - Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                missing-auth-header:
                  summary: Missing authentication
                  value:
                    errorType: AuthenticationError
                    errorMessage: Authorization header is missing or invalid
                    errorCode: MISSING_AUTH_HEADER
                    errorDetails: '{"expected": "Bearer <token>", "received": "none"}'
                    errorTrackingId: TRK-20260115-EE63CB
                invalid-token:
                  summary: Invalid token
                  value:
                    errorType: AuthenticationError
                    errorMessage: Authentication token is invalid or malformed
                    errorCode: INVALID_TOKEN
                    errorDetails: '{"issue": "token signature verification failed"}'
                    errorTrackingId: TRK-20260115-7C3980
                expired-token:
                  summary: Expired token
                  value:
                    errorType: AuthenticationError
                    errorMessage: Authentication token has expired
                    errorCode: EXPIRED_TOKEN
                    errorDetails: '{"expiresAt": "2026-01-15T13:30:00Z", "currentTime": "2026-01-15T14:30:00Z"}'
                    errorTrackingId: TRK-20260115-DDA9C2
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                insufficient-permissions:
                  summary: Insufficient permissions
                  value:
                    errorType: AuthorizationError
                    errorMessage: User does not have required permissions for this operation
                    errorCode: INSUFFICIENT_PERMISSIONS
                    errorDetails: '{"required": "jobs:submit", "provided": "templates:read"}'
                    errorTrackingId: TRK-20260115-C63CC3
                account-suspended:
                  summary: Account suspended
                  value:
                    errorType: AuthorizationError
                    errorMessage: User account has been suspended
                    errorCode: ACCOUNT_SUSPENDED
                    errorDetails: '{"reason": "billing overdue", "contactSupport": "support@click2mail.com"}'
                    errorTrackingId: TRK-20260115-3A3660
        '404':
          description: Not Found - Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                job-not-found:
                  summary: Job not found
                  value:
                    errorType: ResourceNotFoundError
                    errorMessage: The specified job does not exist
                    errorCode: JOB_NOT_FOUND
                    errorDetails: '{"resourceType": "job", "jobId": "JOB-20260115-37D9"}'
                    errorTrackingId: TRK-20260115-37659C
                resource-not-found:
                  summary: Resource not found
                  value:
                    errorType: ResourceNotFoundError
                    errorMessage: Requested resource does not exist
                    errorCode: RESOURCE_NOT_FOUND
                    errorDetails: '{"resourceType": "document", "resourceId": "DOC-20260115-6A15"}'
                    errorTrackingId: TRK-20260115-FB5E2F
        '422':
          description: Unprocessable Entity - Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                invalid-enum-value:
                  summary: Invalid enum value
                  value:
                    errorType: ValidationError
                    errorMessage: Field contains a value not allowed by the enumeration
                    errorCode: INVALID_ENUM_VALUE
                    errorDetails: '{"field": "jobOptions.documentClass", "value": "invalid_value", "allowedValues": ["letter", "postcard", "brochure", "flat"]}'
                    errorTrackingId: TRK-20260115-C794AA
                mutual-exclusion-violation:
                  summary: Mutually exclusive fields
                  value:
                    errorType: ValidationError
                    errorMessage: Request contains mutually exclusive fields
                    errorCode: MUTUAL_EXCLUSION_VIOLATION
                    errorDetails: '{"fields": ["jobTemplate", "jobOptions"], "issue": "only one may be provided"}'
                    errorTrackingId: TRK-20260115-B2BEBA
                invalid-format:
                  summary: Validation failed
                  value:
                    errorType: ValidationError
                    errorMessage: Request validation failed for multiple fields
                    errorCode: INVALID_FORMAT
                    errorDetails: '{"errors": [{"field": "docSourceAll", "issue": "not found in document library"}, {"field": "recipientAddressSource.recipientAddressByList.addressList[0].zip", "issue": "invalid format - must be 5 or 9 digits"}]}'
                    errorTrackingId: TRK-20260115-BB3D06
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                rate-limit-exceeded:
                  summary: Rate limit exceeded
                  value:
                    errorType: RateLimitError
                    errorMessage: "Request rate limit exceeded \u2014 please slow down and retry"
                    errorCode: RATE_LIMIT_EXCEEDED
                    errorDetails: '{"limit": "100 requests/minute", "retryAfterSeconds": 60}'
                    errorTrackingId: TRK-20260115-8D288E
        '500':
          description: Internal Server Error - Server encountered an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
              examples:
                server-error:
                  summary: Internal server error
                  value:
                    errorType: ServerError
                    errorMessage: An unexpected error occurred while processing the request
                    errorCode: SERVER_ERROR
                    errorDetails: '{"timestamp": "2026-01-15T14:30:00Z", "requestId": "req-897bf790"}'
                    errorTrackingId: TRK-20260115-C63668
                database-error:
                  summary: Database error
                  value:
                    errorType: ServerError
                    errorMessage: Database operation failed
                    errorCode: DATABASE_ERROR
                    errorDetails: '{"operation": "insert", "table": "jobs", "error": "connection timeout"}'
                    errorTrackingId: TRK-20260115-92473E
                external-service-error:
                  summary: External service error
                  value:
                    errorType: ServerError
                    errorMessage: External service call failed
                    errorCode: EXTERNAL_SERVICE_ERROR
                    errorDetails: '{"service": "address-validation", "error": "timeout after 30s"}'
                    errorTrackingId: TRK-20260115-E3B8A0
