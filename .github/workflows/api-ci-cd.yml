name: API Spec, Docs, and Postman CI/CD
# Dual-repository workflow: auto-detects workspace from owner (faserrao=personal, click2mail=corporate)

on:
  push:
    branches: [ main ]
    paths:
      # Source files that require regeneration
      - 'data_dictionary/**'           # EBNF data dictionary (source of truth)
      - 'config/**'                     # Configuration files (templates, catalogs)
      - 'Makefile'                      # Build configuration
      - 'scripts/active/**'             # Generation scripts
      - 'scripts/validation/**'         # Validation scripts
      - 'scripts/test_data_generator_for_collections/**'  # Test data generation
      - '.github/workflows/api-ci-cd.yml'  # Workflow changes
  pull_request:
    branches: [ main ]
    paths:
      # Source files that require regeneration
      - 'data_dictionary/**'           # EBNF data dictionary (source of truth)
      - 'config/**'                     # Configuration files (templates, catalogs)
      - 'Makefile'                      # Build configuration
      - 'scripts/active/**'             # Generation scripts
      - 'scripts/validation/**'         # Validation scripts
      - 'scripts/test_data_generator_for_collections/**'  # Test data generation
      - '.github/workflows/api-ci-cd.yml'  # Workflow changes
  workflow_dispatch:
    inputs:
      publish_to_postman:
        description: 'Publish to Postman'
        type: boolean
        default: true

# Pages is served from the artifacts repo, so this pipeline needs only
# contents:write (auto-commit generated files). No pages:/id-token: here.
permissions:
  contents: write

env:
  # Environment configuration
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  OPENAPI_DIR: openapi
  POSTMAN_DIR: postman
  DOCS_DIR: docs
  DATA_DICT_DIR: data_dictionary
  
  # Feature toggles
  PUBLISH_TO_POSTMAN: ${{ github.event.inputs.publish_to_postman || 'true' }}
  
  # Postman configuration
  POSTMAN_API_BASE: https://api.postman.com
  # Note: Workspace is auto-detected from repository owner (faserrao=personal, click2mail=corporate)
  POSTMAN_SERRAO_API_KEY: ${{ secrets.POSTMAN_SERRAO_API_KEY }}
  POSTMAN_C2M_API_KEY: ${{ secrets.POSTMAN_C2M_API_KEY }}

jobs:
  build:
    name: Build API Spec, Collections, and Docs
    runs-on: ubuntu-latest
    
    steps:
      # ---------- Setup ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - name: Checkout security repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/c2m-api-v2-postman-security
          path: c2m-api-v2-security
          token: ${{ secrets.SECURITY_REPO_TOKEN }}

      - name: Checkout artifacts repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/c2m-api-v2-postman-artifacts
          path: artifacts-repo
          token: ${{ secrets.SECURITY_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            scripts/python_env/requirements.txt

      # ---------- Dependencies ----------
      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != '' || hashFiles('scripts/python_env/requirements.txt') != ''
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f scripts/python_env/requirements.txt ]; then
            pip install -r scripts/python_env/requirements.txt
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          # Install Postman CLI
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          # Add Postman CLI to PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      # ---------- Environment Info ----------
      - name: Print environment info
        run: |
          echo "🔧 Environment Information:"
          echo "Python: $(python --version)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "jq: $(jq --version)"
          echo "curl: $(curl --version | head -n 1)"
          echo "postman: $(which postman || echo 'Not found in PATH')"
          echo "GitHub Event: ${{ github.event_name }}"
          echo "GitHub Ref: ${{ github.ref }}"

      - name: Print Make variables (debug)
        run: make -n print-vars || true

      # ---------- Build Steps ----------
      - name: Build OpenAPI from EBNF
        run: |
          echo "📋 Building OpenAPI spec from EBNF data dictionary..."
          make openapi-build

      - name: Lint OpenAPI Spec
        continue-on-error: true
        run: |
          echo "🔍 Linting OpenAPI spec..."
          make lint || echo "⚠️  Linting completed with warnings"

      - name: Diff OpenAPI Spec
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "📊 Comparing OpenAPI spec changes..."
          make diff || echo "ℹ️  Diff completed"

      - name: Build Documentation
        run: |
          echo "📚 Building API documentation..."
          make docs

      - name: Generate SDKs
        continue-on-error: true
        run: |
          echo "🔧 Generating SDKs..."
          make generate-sdk-all || echo "⚠️  SDK generation not fully implemented yet"

      # ---------- Drift Detection (PRs only) ----------
      - name: Check for uncommitted changes
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking for uncommitted generated artifacts..."
          if [ -n "$(git status --porcelain ${{ env.OPENAPI_DIR }} ${{ env.POSTMAN_DIR }}/generated ${{ env.DOCS_DIR }})" ]; then
            echo "❌ Error: Generated artifacts are out of sync!"
            echo "Please run the following commands locally and commit the changes:"
            echo "  make openapi-build"
            echo "  make postman-collection-build"
            echo "  make docs"
            echo ""
            echo "Modified files:"
            git status --porcelain ${{ env.OPENAPI_DIR }} ${{ env.POSTMAN_DIR }}/generated ${{ env.DOCS_DIR }}
            exit 1
          else
            echo "✅ All generated artifacts are up to date"
          fi

      # ---------- Publish to Postman (optional) ----------
      - name: Publish to Postman (Full Cleanup and Rebuild)
        if: |
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && env.PUBLISH_TO_POSTMAN == 'true') ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_postman == 'true'))
        env:
          POSTMAN_SERRAO_API_KEY: ${{ secrets.POSTMAN_SERRAO_API_KEY }}
          POSTMAN_C2M_API_KEY: ${{ secrets.POSTMAN_C2M_API_KEY }}
        run: |
          if [ -z "$POSTMAN_SERRAO_API_KEY" ] && [ -z "$POSTMAN_C2M_API_KEY" ]; then
            echo "⚠️  Skipping Postman publish: No API keys configured"
            echo "   Add POSTMAN_SERRAO_API_KEY and/or POSTMAN_C2M_API_KEY secrets"
          else
            # Auto-detect context from repository owner (enforces 1:1 relationship)
            # faserrao repo → personal Postman ONLY
            # click2mail repo → corporate Postman ONLY
            if [ "${{ github.repository_owner }}" = "faserrao" ]; then
              GIT_CONTEXT="personal"
              echo "personal" > .git-context
              echo "🎯 Auto-detected context from repository owner: personal"
              echo "   Repository: ${{ github.repository }}"
              echo "   Owner: faserrao (personal account)"
              echo "   Postman: Personal workspace ONLY"
            else
              GIT_CONTEXT="click2mail"
              echo "click2mail" > .git-context
              echo "🎯 Auto-detected context from repository owner: click2mail"
              echo "   Repository: ${{ github.repository }}"
              echo "   Owner: ${{ github.repository_owner }} (organization)"
              echo "   Postman: Corporate workspace ONLY"
            fi

            echo ""
            echo "🚀 FULL CLEANUP AND REBUILD of Postman workspace..."
            echo "   Context: $GIT_CONTEXT"
            echo "   API Keys available: SERRAO=$([ -n "$POSTMAN_SERRAO_API_KEY" ] && echo "Yes" || echo "No"), C2M=$([ -n "$POSTMAN_C2M_API_KEY" ] && echo "Yes" || echo "No")"
            echo ""
            echo "   This will DELETE and RECREATE:"
            echo "   - API Definitions"
            echo "   - OpenAPI Specs (standalone)"
            echo "   - Collections (Linked, Test, Use Cases)"
            echo "   - Mock Servers"
            echo "   - Environments"
            echo ""
            export POSTMAN_SERRAO_API_KEY
            export POSTMAN_C2M_API_KEY
            export BUILD_TYPE=github
            make workspace-info
            echo ""
            echo "🔄 Full cleanup and rebuild (deletes all Postman resources including mocks and environments)"
            make rebuild-all-with-delete-ci
          fi

      # ---------- Post-Build Validation ----------
      - name: Run Post-Build Validation
        if: |
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && env.PUBLISH_TO_POSTMAN == 'true') ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_postman == 'true'))
        env:
          POSTMAN_SERRAO_API_KEY: ${{ secrets.POSTMAN_SERRAO_API_KEY }}
          POSTMAN_C2M_API_KEY: ${{ secrets.POSTMAN_C2M_API_KEY }}
        run: |
          # Auto-detect workspace from repository owner (identical workflow in both repos)
          if [ "${{ github.repository_owner }}" = "faserrao" ]; then
            WORKSPACE="personal"
            echo "🎯 Auto-detected workspace: personal (faserrao)"
          else
            WORKSPACE="corporate"
            echo "🎯 Auto-detected workspace: corporate (${{ github.repository_owner }})"
          fi

          echo "🔍 Running post-build validation..."
          echo "   Workspace: $WORKSPACE"
          echo "   Repository: ${{ github.repository }}"

          # Run CI validation script
          ./scripts/validation/ci_verify.sh "$WORKSPACE"

      - name: Upload Validation Reports
        continue-on-error: true  # A storage-quota hit here must NOT skip the artifacts-repo push below
        if: |
          always() &&
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && env.PUBLISH_TO_POSTMAN == 'true') ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_postman == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            reports/validation-*.md
            reports/validation-*.json
            reports/newman-*.html
            reports/newman-*.json
          retention-days: 30

      # ---------- Copy artifacts to artifacts repo ----------
      - name: Copy artifacts to artifacts repository
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "📦 Copying ALL generated artifacts to artifacts repository..."
          # Create directories if they don't exist
          mkdir -p artifacts-repo/openapi
          mkdir -p artifacts-repo/postman/collections
          mkdir -p artifacts-repo/postman/metadata
          mkdir -p artifacts-repo/docs
          mkdir -p artifacts-repo/sdks

          echo "📋 Copying OpenAPI specs..."
          cp -v ${{ env.OPENAPI_DIR }}/*.yaml artifacts-repo/openapi/ 2>/dev/null || echo "  ⚠️  No OpenAPI specs to copy"

          echo "📦 Copying Postman collections..."
          cp -v ${{ env.POSTMAN_DIR }}/generated/*.json artifacts-repo/postman/collections/ 2>/dev/null || echo "  ⚠️  No collections to copy"

          echo "📄 Copying Postman metadata (UIDs, URLs)..."
          cp -v ${{ env.POSTMAN_DIR }}/*.txt artifacts-repo/postman/metadata/ 2>/dev/null || echo "  ⚠️  No txt files to copy"
          cp -v ${{ env.POSTMAN_DIR }}/*.json artifacts-repo/postman/metadata/ 2>/dev/null || echo "  ⚠️  No json files to copy"

          echo "📚 Copying documentation (Redocly)..."
          cp -rv ${{ env.DOCS_DIR }}/* artifacts-repo/docs/ 2>/dev/null || echo "  ⚠️  No docs to copy"

          echo "🔧 Copying SDKs (Python, JavaScript, etc.)..."
          if [ -d "sdk" ]; then
            cp -rv sdk/* artifacts-repo/sdks/ 2>/dev/null || echo "  ⚠️  No SDKs to copy"
          else
            echo "  ⚠️  SDK directory not found (generation may have failed)"
          fi

          echo "📝 Generating artifacts README with organization..."
          sed "s|__GITHUB_ORG__|${{ github.repository_owner }}|g" ARTIFACTS_README.md.template > artifacts-repo/README.md
          echo "  ✅ README generated for organization: ${{ github.repository_owner }}"

          echo "✅ All artifacts copied successfully"

      # ---------- Commit and push to artifacts repo ----------
      - name: Commit and push artifacts
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: artifacts-repo
        env:
          # Pass untrusted commit text via env (NOT inline ${{ }}) to prevent
          # shell injection: a commit message containing quotes/backticks/$()
          # would otherwise break out of the double-quoted string. This is what
          # caused exit 127 on the "stop deploying GitHub Pages" commit, whose
          # body contained the quoted phrase "Get Pages site failed".
          SRC_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "c2m-api-bot"
          git config user.email "c2m-api-bot@users.noreply.github.com"

          # Add all changes
          git add .

          # Build info commit message. Use only the SUBJECT line, and reference
          # the env var as a shell variable (safe — not re-parsed by the shell).
          SRC_SUBJECT=$(printf '%s' "$SRC_COMMIT_MSG" | head -n1)
          COMMIT_MSG="Build #${{ github.run_number }}: Update from ${SRC_SUBJECT}"
          
          # Commit (don't fail if no changes)
          git commit -m "$COMMIT_MSG" \
            -m "Source commit: ${{ github.sha }}" \
            -m "Workflow: ${{ github.workflow }}" \
            -m "Triggered by: ${{ github.actor }}" || {
            echo "No changes to commit"
            exit 0
          }
          
          # Push to artifacts repo (force to avoid rejection from diverged history)
          git push origin main --force

      # ---------- Upload artifacts ----------
      - name: Upload build artifacts
        continue-on-error: true  # Non-essential; a storage-quota hit must NOT fail the run or block Pages
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: |
            ${{ env.OPENAPI_DIR }}/*.yaml
            ${{ env.POSTMAN_DIR }}/generated/*.json
            ${{ env.POSTMAN_DIR }}/*.txt
            ${{ env.POSTMAN_DIR }}/*.json
            ${{ env.DOCS_DIR }}/**
            sdk/**

      # NOTE: GitHub Pages is intentionally NOT deployed from this pipeline repo.
      # The generated docs are force-pushed to the artifacts repo
      # (c2m-api-v2-postman-artifacts), which is the ONLY repo where Pages is
      # enabled and served (see the "Copy/Commit and push artifacts" steps above).

  # ---------- Summary ----------
  summary:
    name: Workflow Summary
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 CI/CD Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build status
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Docs are published from the artifacts repo (Pages is NOT deployed here)
          echo "### Docs" >> $GITHUB_STEP_SUMMARY
          echo "📄 Docs force-pushed to the artifacts repo, which serves GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Links
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY