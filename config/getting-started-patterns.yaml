# =============================================================================
# Getting Started Collection - Pattern Definitions
# =============================================================================
#
# This configuration file defines the patterns used in the Getting Started
# collection. Each pattern demonstrates a specific API usage scenario.
#
# Structure:
#   - name: Human-readable pattern name
#   - description: Detailed description of what this pattern demonstrates
#   - category: Groups patterns by usage frequency
#   - endpoint: API endpoint path
#   - body_template: JSON request body with placeholders (<string>, <integer>, <oneOf>)
#   - filters: Criteria for selecting real test data from permutations (optional)
#
# Categories:
#   - Most Frequently Used: Common everyday use cases
#   - Bulk Operations: High-volume processing scenarios
#   - Advanced Patterns: Less frequent but important variations
#
# =============================================================================

patterns:
  # ===========================================================================
  # Category 1: Most Frequently Used (3 patterns)
  # ===========================================================================

  - name: "Single recipient - basic job submission"
    description: "Submit a single document to one recipient using jobTemplate"
    category: "Most Frequently Used"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Mail merge - multiple recipients"
    description: "Submit a single document to multiple recipients (mail merge)"
    category: "Most Frequently Used"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        addressList:
          - firstName: "<string>"
            lastName: "<string>"
            address1: "<string>"
            city: "<string>"
            state: "<string>"
            zip: "<string>"
            foo1: "<string>"  # Custom merge field
            foo2: "<string>"  # Custom merge field
          - firstName: "<string>"
            lastName: "<string>"
            address1: "<string>"
            city: "<string>"
            state: "<string>"
            zip: "<string>"
            foo1: "<string>"
            foo2: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "addressList"
      paymentDetails: "any"

  - name: "Address capture - PDF with embedded addresses"
    description: "Submit PDF where addresses are captured from the document itself"
    category: "Most Frequently Used"
    endpoint: "/jobs/submit/single/pdf/addressCapture"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "addressCapture"
      paymentDetails: "any"

  # ===========================================================================
  # Category 2: Bulk Operations (3 patterns)
  # ===========================================================================

  - name: "Split PDF with address capture"
    description: "Split a multi-page PDF and capture addresses from each section"
    category: "Bulk Operations"
    endpoint: "/jobs/submit/single/pdf/split/addressCapture"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      jobs:
        - pages:
            startPage: "<integer>"
            endPage: "<integer>"
        - pages:
            startPage: "<integer>"
            endPage: "<integer>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "addressCapture"
      paymentDetails: "any"

  - name: "Split PDF with specified addresses"
    description: "Split a multi-page PDF and provide recipient address for each section"
    category: "Bulk Operations"
    endpoint: "/jobs/submit/single/pdf/split"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      jobs:
        - pages:
            startPage: "<integer>"
            endPage: "<integer>"
          recipientAddressSource:
            singleAddress:
              firstName: "<string>"
              lastName: "<string>"
              address1: "<string>"
              city: "<string>"
              state: "<string>"
              zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Multiple documents from ZIP with address capture"
    description: "Submit multiple documents from a ZIP file with embedded addresses"
    category: "Bulk Operations"
    endpoint: "/jobs/submit/multi/zip/addressCapture"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "addressCapture"
      paymentDetails: "any"

  # ===========================================================================
  # Category 3: Advanced Patterns (10 patterns)
  # ===========================================================================

  - name: "Merge multiple documents"
    description: "Combine multiple documents into one before mailing"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/multi/doc/merge"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        documentsToMerge:
          - requestId: "<integer>"
          - documentId: "<integer>"
          - documentId: "<integer>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "documentsToMerge"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Using jobOptions instead of template"
    description: "Specify job options directly instead of using a template"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobOptions:
        documentClass: "<string>"
        layout: "<string>"
        productionTime: "<string>"
        envelope: "<string>"
        color: "<string>"
        paperType: "<string>"
        printOption: "<string>"
        mailClass: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
    filters:
      has_jobTemplate: false
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Using document URL instead of upload"
    description: "Reference a document by URL instead of uploading"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        url: "<string>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "url"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Adding tags for organization"
    description: "Add custom tags to track and organize jobs"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
      tags:
        - "<string>"
        - "<string>"
        - "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Naming an address list for reuse"
    description: "Create a named address list that can be referenced in future jobs"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        addressListName: "<string>"
        mappingId: "<integer>"
        addressList:
          - firstName: "<string>"
            lastName: "<string>"
            address1: "<string>"
            city: "<string>"
            state: "<string>"
            zip: "<string>"
            foo1: "<string>"
            foo2: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "addressListName"
      paymentDetails: "any"

  - name: "Specifying payment method"
    description: "Specify how the job should be paid for"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
      paymentDetails:
        creditCard:
          cardNumber: "<string>"
          cardType: "<string>"
          cvv: "<string>"
          expirationMonth: "<string>"
          expirationYear: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "creditCard"

  - name: "Multiple documents from ZIP - specify addresses"
    description: "Submit multiple documents from ZIP with specified addresses for each"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/multi/zip"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      jobs:
        - filename: "<string>"
          recipientAddressSource:
            singleAddress:
              firstName: "<string>"
              lastName: "<string>"
              address1: "<string>"
              city: "<string>"
              state: "<string>"
              zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Multiple separate documents"
    description: "Submit multiple different documents with different recipients"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/multi/doc"
    body_template:
      jobTemplate: "<string>"
      jobs:
        - documentSource:
            documentId: "<integer>"
          recipientAddressSource:
            singleAddress:
              firstName: "<string>"
              lastName: "<string>"
              address1: "<string>"
              city: "<string>"
              state: "<string>"
              zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "documentId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Using stored documentId"
    description: "Reference a previously uploaded document by its ID"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        documentId: "<integer>"
      recipientAddressSource:
        singleAddress:
          firstName: "<string>"
          lastName: "<string>"
          address1: "<string>"
          city: "<string>"
          state: "<string>"
          zip: "<string>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "documentId"
      recipientAddressSource: "singleAddress"
      paymentDetails: "any"

  - name: "Using saved addressListId"
    description: "Reference a previously saved address list by its ID"
    category: "Advanced Patterns"
    endpoint: "/jobs/submit/single/doc"
    body_template:
      jobTemplate: "<string>"
      documentSource:
        requestId: "<integer>"
      recipientAddressSource:
        addressListId: "<integer>"
    filters:
      has_jobTemplate: true
      documentSourceIdentifier: "requestId"
      recipientAddressSource: "addressListId"
      paymentDetails: "any"
