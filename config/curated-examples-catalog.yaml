  # ============================================================================
  # GETTING STARTED - Educational Pattern Examples
  # ============================================================================

  # ============================================================================
  # MOST FREQUENT
  # ============================================================================

  - name: Single Document to Single Recipient
    method: POST
    path: /static
    group: most-frequently-used
    tags:
      - getting-started
      - frequent
      - basic
    description: Send a personalized document to one recipient (most common use case)
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      jobTemplate: standard_letter
      tags:
        - example
        - basic

  - name: Mail Merge to Address List
    method: POST
    path: /mail-merge
    group: most-frequently-used
    tags:
      - getting-started
      - frequent
      - mail-merge
    description: Merge multiple documents and send combined output to recipients from a stored address list
    select:
      recipientAddressSource: recipientAddressByListId
      paymentDetails: ach
    values:
      jobTemplate: mail_merge_template
      mergeDocumentSource:
        - mergeByDocumentId:
            documentId: 11111
        - mergeByDocumentId:
            documentId: 22222
      tags:
        - example
        - mail-merge

  - name: Embedded Address Capture
    method: POST
    path: /static/address-capture
    group: most-frequently-used
    tags:
      - getting-started
      - frequent
      - address-capture
    description: Send documents where recipient addresses are embedded in the PDF
    select:
      docSourceStandard: documentIdSource
      paymentDetails: invoice
    values:
      tags:
        - example
        - address-capture

  # ============================================================================
  # BULK OPERATIONS - Processing Multiple Items (3 patterns)
  # ============================================================================

  - name: Split PDF with Address Capture
    method: POST
    path: /batch/split/address-capture
    group: bulk-operations
    tags:
      - getting-started
      - bulk
      - split-pdf
    description: Split a multi-page PDF where each page has embedded recipient address
    select:
      docSourceStandard: documentIdSource
      paymentDetails: creditCard
    values:
      pdfSplitJobsNoAddress:
        - startPage: 1
          endPage: 3
      tags:
        - bulk
        - split-pdf

  - name: Split PDF with Specified Addresses
    method: POST
    path: /batch/split
    group: bulk-operations
    tags:
      - getting-started
      - bulk
      - split-pdf
    description: Split a multi-page PDF and specify recipient addresses separately
    select:
      docSourceStandard: documentIdSource
      paymentDetails: ach
    values:
      pdfSplitJobsWithAddress:
        - startPage: 1
          endPage: 3
          recipientAddressSource:
            singleAddress:
              firstName: <String>
              lastName: <String>
              address1: <String>
              city: <String>
              state: <String>
              zip: <String>
              country: <String>
      tags:
        - bulk
        - split-pdf

  - name: Multiple Documents from ZIP with Address Capture
    method: POST
    path: /batch/zip/address-capture
    group: bulk-operations
    tags:
      - getting-started
      - bulk
      - zip-processing
    description: Process multiple documents from ZIP file with embedded addresses
    select:
      zipDocumentSource: zipDocumentIdSource
      paymentDetails: invoice
    values:
      tags:
        - bulk
        - zip

  # ============================================================================
  # ADVANCED PATTERNS - Specialized Use Cases (10 patterns)
  # ============================================================================

  - name: Merge Multiple Documents
    method: POST
    path: /mail-merge
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - merge
    description: Merge multiple separate documents into one mailing per recipient
    select:
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      mergeDocumentSource:
        - mergeByDocumentId:
            documentId: 3001
        - mergeByDocumentId:
            documentId: 3002
        - mergeByDocumentId:
            documentId: 3003
      tags:
        - advanced
        - merge

  - name: Using jobOptions Instead of Template
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - job-options
    description: Specify mailing options directly without using a saved template
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      jobOptions:
        documentClass: letter
        layout: address_on_first_page
        productionTime: standard
        envelope: double_window
        color: full_color
        paperType: white
        printOption: double_sided
        mailClass: first_class
      tags:
        - advanced
        - job-options

  - name: Using Document URL Instead of Upload
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - url-source
    description: Provide document via URL instead of uploading file
    select:
      docSourceAll: urlSource
      recipientAddressSource: recipientAddressByListId
      paymentDetails: ach
    values:
      jobTemplate: standard_letter
      tags:
        - advanced
        - url

  - name: Adding Tags for Organization
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - tags
    description: Add custom tags to organize and track your mailings
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: singleAddress
      paymentDetails: invoice
    values:
      jobTemplate: marketing_postcard
      tags:
        - campaign-q1
        - region-west
        - priority-high

  - name: Naming an Address List for Reuse
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - address-naming
    description: Give your address list a name so you can reuse it later
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: recipientAddressByList
      paymentDetails: creditCard
    values:
      mappingId: "REUSABLE-LIST-Q1"
      addressList:
        - firstName: <String>
          lastName: <String>
          address1: <String>
          city: <String>
          state: <String>
          zip: <String>
          country: <String>
      tags:
        - advanced
        - list-naming

  - name: Specifying Payment Method
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - payment
    description: Choose between credit card, ACH, or invoice billing
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: singleAddress
      paymentDetails: ach
    values:
      jobTemplate: invoice_statement
      tags:
        - advanced
        - ach-payment

  - name: Multiple Documents from ZIP - Specify Addresses
    method: POST
    path: /batch/zip
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - zip-with-addresses
    description: Process ZIP with multiple documents and provide addresses separately
    select:
      docSourceZipFileRef: zipDocumentIdOnly
      paymentDetails: invoice
    values:
      multiZipJobs:
        - jobTemplate: standard_letter
          filename: letter_001.pdf
          recipientAddressSource:
            singleAddress:
              firstName: <String>
              lastName: <String>
              address1: <String>
              city: <String>
              state: <String>
              zip: <String>
              country: <String>
        - jobTemplate: standard_letter
          filename: letter_002.pdf
          recipientAddressSource:
            singleAddress:
              firstName: <String>
              lastName: <String>
              address1: <String>
              city: <String>
              state: <String>
              zip: <String>
              country: <String>
      tags:
        - advanced
        - zip

  - name: Using Stored documentId
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - stored-document
    description: Reference a previously uploaded document by its ID
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      jobTemplate: stored_template
      tags:
        - advanced
        - stored-id

  - name: Using Saved addressListId
    method: POST
    path: /static
    group: advanced-patterns
