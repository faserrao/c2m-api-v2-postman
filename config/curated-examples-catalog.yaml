  - name: Marketing Agency - Multi-Document Campaign
    method: POST
    path: /mail-merge
    tags:
      - real-world
      - marketing
      - multi-document
    description: Marketing agency sends personalized multi-page campaign materials
    select:
      recipientAddressSource: recipientAddressByListId
      paymentDetails: invoice
    values:
      mergeDocumentSource:
        - mergeByDocumentId:
            documentId: 44444
        - mergeByDocumentId:
            documentId: 55555
        - mergeByDocumentId:
            documentId: 66666

      tags:
        - marketing
        - campaign
        - multi-document

  - name: Reseller - Multi-ZIP Batch Processing
    method: POST
    path: /batch/zip
    tags:
      - real-world
      - reseller
      - batch-processing
    description: Mail service bureau processes multiple documents from a single ZIP file
    select:
      docSourceZipFileRef: zipRequestIdOnly
      paymentDetails: ach
    values:
      multiZipJobs:
        - jobTemplate: standard_letter
          filename: invoice_001.pdf
          recipientAddressSource:
            singleAddress:
              firstName: <String>
              lastName: <String>
              address1: <String>
              city: <String>
              state: <String>
              zip: <String>
              country: <String>
        - jobTemplate: standard_letter
          filename: invoice_002.pdf
          recipientAddressSource:
            singleAddress:
              firstName: <String>
