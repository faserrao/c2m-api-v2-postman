  # ============================================================================
  # ADVANCED PATTERNS - Specialized Use Cases (10 patterns)
  # ============================================================================

  - name: Merge Multiple Documents
    method: POST
    path: /mail-merge
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - merge
    description: Merge multiple separate documents into one mailing per recipient
    select:
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      documentIds:
        - 3001
        - 3002
        - 3003
      tags:
        - advanced
        - merge

  - name: Using jobOptions Instead of Template
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - job-options
    description: Specify mailing options directly without using a saved template
    select:
      docSourceAll: documentId
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      mailClass: firstClass
      color: fullColor
      paperType: glossy
      envelope: double_window
      tags:
        - advanced
        - job-options

  - name: Using Document URL Instead of Upload
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - url-source
    description: Provide document via URL instead of uploading file
    select:
      docSourceAll: url
      recipientAddressSource: addressListId
      paymentDetails: ach
    values:
      url: "https://example.com/documents/newsletter.pdf"
      addressListId: "URL-LIST-001"
      jobTemplate: standard_letter
      accountNumber: "5555555555"
      tags:
        - advanced
        - url

  - name: Adding Tags for Organization
    method: POST
    path: /static
    group: advanced-patterns
    tags:
      - getting-started
      - advanced
      - tags
