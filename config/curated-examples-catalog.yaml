    select:
      docSourceAll: documentId
      recipientAddressSource: addressListId
      paymentDetails: invoice
    values:
      addressListId: "LIST-A001"
      jobTemplate: real_estate_marketing
      customerAccountId: "ACCT-987654"
      tags:
        - real-estate
        - marketing
        - bulk-mail

