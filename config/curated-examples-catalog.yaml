# C2M API V2 - Curated Examples Catalog
# Single source of truth for all curated collection examples
#
# Architecture: Read structure from Linked Collection, write values only
# This catalog contains ONLY the example values (leaf data), never request structure
#
# The generator will:
# 1. Read canonical request template from Linked Collection
# 2. Apply oneOf selections (choose which variant to materialize)
# 3. Fill leaf values from this catalog into the canonical structure
# 4. No other structural manipulation allowed
#
# Key Principle: FLAT VALUES ONLY
# - No nested objects (generator knows nesting from Linked Collection)
# - Only leaf primitive values (strings, numbers, booleans)
# - Arrays are okay (tags, documentIds list)
#
# Collections generated:
# - Real World Use Cases (curated business scenarios)
# - Getting Started (educational patterns with hierarchical folders)
#
# NEW: Groups support for hierarchical folder structure in Postman
# Groups are used only for collections with 'getting-started' tag
# Each group becomes a Postman folder with display_name and order

groups:
  - logical_name: most-frequently-used
    display_name: Most Frequently Used
    order: 1
    description: The three most common API usage patterns

  - logical_name: bulk
    display_name: Bulk
    order: 2
    description: Processing multiple documents or recipients

  - logical_name: less-frequently-used
    display_name: Less frequently used
    order: 3
    description: Specialized use cases and advanced features

examples:
  # ============================================================================
