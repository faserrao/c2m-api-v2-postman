# C2M API V2 - Curated Examples Catalog
# Single source of truth for all curated collection examples
#
# Architecture: Read structure from Linked Collection, write values only
# This catalog contains ONLY the example values (leaf data), never request structure
#
# The generator will:
# 1. Read canonical request template from Linked Collection
# 2. Apply oneOf selections (choose which variant to materialize)
# 3. Fill leaf values from this catalog into the canonical structure
# 4. No other structural manipulation allowed
#
# Key Principle: FLAT VALUES ONLY
# - No nested objects (generator knows nesting from Linked Collection)
# - Only leaf primitive values (strings, numbers, booleans)
# - Arrays are okay (tags, documentIds list)
#
# Note on jobTemplate values: jobTemplate is defined as type: string (no enum)
# in the OpenAPI spec because template names are customer-defined in the C2M
# system and passed to the API verbatim. The values used here (e.g.
# standard_letter, legal_certified_mail) are illustrative — they are NOT
# validated against the spec.
#
# Collections generated:
# - Real World Use Cases (curated business scenarios)
# - Getting Started (educational patterns with hierarchical folders)
#
# NEW: Groups support for hierarchical folder structure in Postman
# Groups are used only for collections with 'getting-started' tag
# Each group becomes a Postman folder with display_name and order

groups:
  - logical_name: most-frequently-used
    display_name: Most Frequently Used
    order: 1
    description: The three most common API usage patterns

  - logical_name: bulk-operations
    display_name: Bulk Operations
    order: 2
    description: Processing multiple documents or recipients

  - logical_name: advanced-patterns
    display_name: Advanced Patterns
    order: 3
    description: Specialized use cases and advanced features

examples:
  # ============================================================================
  # REAL WORLD USE CASES - Business Scenario Examples
  # ============================================================================

  - name: Legal Firm - Court Notices
    method: POST
    path: /static
    tags:
      - real-world
      - legal
      - certified-mail
    description: Law firm sends certified court appearance notices to clients with proof of delivery tracking
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: singleAddress
      paymentDetails: creditCard
    values:
      # Document source
      # Recipient address (flat values - structure from Linked Collection)
      # Job template
      jobTemplate: legal_certified_mail
      # Payment (flat values - creditCard structure from Linked Collection)
      # Tags
      tags:
        - legal
        - certified
        - client-correspondence

  - name: Real Estate Agent - Property Marketing
    method: POST
    path: /static
    tags:
      - real-world
      - real-estate
      - bulk-marketing
    description: Real estate agent sends property listings to address list with merge fields
    select:
      docSourceAll: documentIdSource
      recipientAddressSource: recipientAddressByListId
      paymentDetails: invoice
    values:
      jobTemplate: real_estate_marketing

      tags:
        - real-estate
        - marketing
        - bulk-mail

  - name: Medical Agency - Patient Reminders
    method: POST
    path: /mail-merge
    tags:
      - real-world
      - medical
      - document-merging
    description: Medical office merges patient test results with consultation letters
    select:
      recipientAddressSource: singleAddress
      paymentDetails: ach
    values:
      mergeDocumentSource:
        - mergeByDocumentId:
            documentId: 11111
        - mergeByDocumentId:
            documentId: 22222
      jobTemplate: medical_correspondence
      tags:
        - medical
        - hipaa
        - patient-correspondence

  - name: Monthly Newsletters - Bulk Distribution
