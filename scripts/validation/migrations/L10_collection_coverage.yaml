  - {where: catalog, name: Utility Company - Monthly Bills}
  - {where: catalog, name: HR Department - Annual Benefit Statements}
  - {where: catalog, name: Insurance Agency - Policy Renewal Notices}
  - {where: Real-World, name: Utility Company - Monthly Bills}
  - {where: Real-World, name: HR Department - Annual Benefit Statements}
  - {where: Real-World, name: Insurance Agency - Policy Renewal Notices}
rules:
  changed: []
schemas:
  changed: []
allowed_added_paths: []
