name: L10 (D8) — Real-World covers every job endpoint; JWT pre-request script (L8)
# User decision 2026-10-16:
# - Real-World gains business scenarios for the three job endpoints it lacked
#   (/batch/split, /batch/split/address-capture, /batch/zip/address-capture).
# - Real-World gets the same JWT pre-request script as Linked (L8; collection event,
#   not recorded by snapshots).
